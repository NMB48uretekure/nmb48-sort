name: 卒業生の写真を取り込む

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 写真をダウンロード
        run: |
          pip install pillow
          python - <<'PY'
          import re, json, hashlib, urllib.parse, urllib.request, io, os
          from PIL import Image

          html = open('index.html', encoding='utf-8').read()
          block = html[html.index('const GRAD_PHOTO = {'):]
          block = block[:block.index('};')]
          entries = re.findall(r"'([^']+)':\s*(\[[^\]]*\])", block)
          os.makedirs('img', exist_ok=True)
          ok, ng = 0, []
          for name, arr in entries:
              vals = json.loads(arr)
              y, _, n = vals[0].partition('_')
              names = vals[1:] or [name]
              saved = False
              for nm in names:
                  f = f"{y}年NMB48プロフィール_{nm}" + (f"_{n}" if n else "") + ".jpg"
                  h = hashlib.md5(f.encode()).hexdigest()
                  url = f"https://48pedia.org/images/{h[0]}/{h[:2]}/" + urllib.parse.quote(f)
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (nmb48-sort photo fetch)'})
                      data = urllib.request.urlopen(req, timeout=30).read()
                      im = Image.open(io.BytesIO(data)).convert('RGB')
                      w, hh = im.size; s = min(w, hh)
                      top = int((hh - s) * 0.15) if hh > w else (hh - s) // 2
                      im = im.crop(((w - s) // 2, top, (w - s) // 2 + s, top + s)).resize((300, 300), Image.LANCZOS)
                      im.save(f"img/{name}.jpg", quality=82, optimize=True)
                      ok += 1; saved = True
                      break
                  except Exception as e:
                      print('skip', f, e)
              if not saved:
                  ng.append(name)
          print(f'保存: {ok}人 / 取れなかった: {len(ng)}人', ng)
          PY

      - name: 保存した写真をサイトに追加
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img
          git commit -m "卒業生の写真を取り込み" || echo "変更なし"
          git push
