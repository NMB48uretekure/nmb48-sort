name: ジャケ写を取り込む

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ジャケ写をダウンロード
        run: |
          pip install pillow
          python - <<'PY'
          import re, json, io, os, urllib.request
          from PIL import Image

          html = open('songs.html', encoding='utf-8').read()
          block = html[html.index('const JACKETS = ') + len('const JACKETS = '):]
          block = block[:block.index('};') + 1]
          jackets = json.loads(block)
          os.makedirs('jacket', exist_ok=True)
          ok, ng = 0, []
          for key, url in jackets.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (nmb48-sort jacket fetch)'})
                  data = urllib.request.urlopen(req, timeout=30).read()
                  im = Image.open(io.BytesIO(data)).convert('RGB')
                  w, h = im.size; s = min(w, h)
                  im = im.crop(((w - s) // 2, (h - s) // 2, (w - s) // 2 + s, (h - s) // 2 + s)).resize((300, 300), Image.LANCZOS)
                  im.save(f'jacket/{key}.jpg', quality=85, optimize=True)
                  ok += 1
              except Exception as e:
                  print('skip', key, e)
                  ng.append(key)
          print(f'保存: {ok}枚 / 取れなかった: {len(ng)}枚', ng)
          PY

      - name: 保存したジャケ写をサイトに追加
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add jacket
          git commit -m "ジャケ写を取り込み" || echo "変更なし"
          git push
