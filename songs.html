<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMB48 楽曲ソート</title>
<style>
  :root {
    --main: #f07800;
    --main-dark: #c95f00;
    --sub: #fff1e0;
    --line: #ffd2a3;
    --bg: #fff8f0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    text-align: center; background: var(--bg); color: #333;
    margin: 0; padding: 15px 15px 90px;
  }
  h1 { font-size: 22px; color: var(--main); margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  p.desc { font-size: 13px; color: #666; margin: 0 0 10px; line-height: 1.6; }
  a.back { display: inline-block; font-size: 12px; color: var(--main-dark); margin-bottom: 12px; text-decoration: none;
    background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 14px; }
  .step-container {
    background: #fff; padding: 15px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1); max-width: 500px; margin: 0 auto 20px;
  }
  button {
    padding: 10px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 20px;
    background: var(--main); color: #fff; cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #ccc; }
  .btn-wide { display: block; width: 92%; max-width: 360px; margin: 14px auto 0; padding: 14px; font-size: 16px; border-radius: 999px; }
  .btn-light { background: var(--sub); color: var(--main-dark); }
  .btn-secondary { background: #666; }
  .btn-twitter { background: #000; }
  .btn-small { padding: 6px 14px; font-size: 12px; }
  .jk { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--sub); display: block; }
  .jk-ph { width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffb35c, #f07800); color: #fff; font-size: 10px; font-weight: bold; line-height: 1.1; }
  .battle-card .jk, .battle-card .jk-ph { width: 100%; max-width: 150px; height: auto; aspect-ratio: 1; border-radius: 10px; margin-bottom: 10px; font-size: 16px; }
  .hidden { display: none !important; }

  .tabs { display: flex; background: #fff; border-radius: 25px; padding: 4px; margin: 4px 0 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .tab { flex: 1; padding: 9px 4px; border-radius: 21px; background: transparent; color: #666; font-size: 14px; }
  .tab.active { background: var(--main); color: #fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .chip { padding: 6px 12px; font-size: 12px; border-radius: 999px; background: #fff; color: var(--main-dark);
    border: 1.5px solid var(--line); font-weight: bold; }
  .chip.on { background: var(--main); color: #fff; border-color: var(--main); }
  .search { width: 100%; padding: 10px 12px; font-size: 15px; border: 2px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .bulk { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .bulk button { flex: 1; }

  .group-head { text-align: left; font-weight: bold; color: var(--main); font-size: 13px;
    margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .group-head .hl { flex: 1; min-width: 0; }
  .group-head .cat { font-size: 10px; color: #fff; background: #d9a36b; border-radius: 6px; padding: 1px 6px; font-weight: bold; }
  .group-head .all { margin-left: auto; font-size: 11px; padding: 3px 10px; background: var(--sub); color: var(--main-dark); }
  .songs { display: flex; flex-wrap: wrap; gap: 6px; }
  .song { padding: 7px 11px; font-size: 13px; border-radius: 10px; background: #fff; color: #444;
    border: 1.5px solid #eadccb; font-weight: normal; text-align: left; line-height: 1.35; }
  .song.title { font-weight: bold; }
  .song.on { background: var(--main); color: #fff; border-color: var(--main); }
  .empty-msg { color: #999; font-size: 13px; padding: 30px 0; }

  .sticky-bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96);
    box-shadow: 0 -2px 10px rgba(0,0,0,.1); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  .sticky-inner { max-width: 500px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .sel-info { flex: 1; text-align: left; font-size: 13px; }
  .sel-info b { font-size: 22px; color: var(--main); }
  .sel-info small { display: block; color: #999; font-size: 11px; }

  .battle-container { display: flex; align-items: stretch; gap: 10px; margin: 18px 0; }
  .battle-card { flex: 1; min-height: 170px; border: 3px solid var(--line); border-radius: 14px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 10px; cursor: pointer;
    transition: transform .1s; }
  .battle-card:active { transform: scale(.97); border-color: var(--main); }
  .battle-card .t { font-size: 18px; font-weight: bold; line-height: 1.4; word-break: break-word; }
  .battle-card .s { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.4; }
  .jwrap { width: 100%; display: flex; justify-content: center; }
  .vs-text { align-self: center; font-size: 18px; font-weight: bold; color: var(--main); }
  .draw-btn { margin: 4px auto 12px; font-size: 15px; }

  .result-img-wrap { position: relative; margin: 6px 0 4px; }
  #result-img { width: 100%; display: block; border-radius: 14px; box-shadow: 0 3px 14px rgba(0,0,0,.12); min-height: 200px; background: var(--sub); }
  .result-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--main); font-weight: bold; font-size: 14px; }
  .help { font-size: 11px; color: #999; margin: 8px 0 0; }
  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
    font-size: 13px; padding: 10px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: .3s; z-index: 20; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>NMB48 楽曲ソート</h1>
<a class="back" href="index.html">← 好き顔 神7ソートはこっち</a>

<!-- 予選 -->
<div id="phase1" class="step-container">
  <h2>好きな曲、選んでな</h2>
  <div class="tabs">
    <button class="tab" data-top="7" onclick="setTop(7)">TOP7</button>
    <button class="tab active" data-top="10" onclick="setTop(10)">TOP10</button>
    <button class="tab" data-top="16" onclick="setTop(16)">TOP16</button>
  </div>
  <p class="desc">好きな曲をタップして選んでな。選んだ曲の中から2択バトルで順位を決めるで！<br>たくさん選ぶほどバトルの回数は増えるで</p>
  <div class="chips" id="cat-chips"></div>
  <input class="search" id="search" type="search" placeholder="曲名・シングル・公演名で検索" oninput="renderList()">
  <div class="bulk">
    <button class="btn-small btn-light" onclick="bulk(true)">表示中の曲を全部選ぶ</button>
    <button class="btn-small btn-light" onclick="bulk(false)">表示中の曲を全部外す</button>
  </div>
  <div id="song-list"></div>
</div>

<!-- バトル -->
<div id="phase2" class="step-container hidden">
  <h2>どっちの曲が好きなん？</h2>
  <p class="desc" id="progress-desc"></p>
  <div class="battle-container">
    <div class="battle-card" onclick="selectWinner(0)"><div class="jwrap" id="f0-j"></div><div class="t" id="f0-t"></div><div class="s" id="f0-s"></div></div>
    <div class="vs-text">VS</div>
    <div class="battle-card" onclick="selectWinner(1)"><div class="jwrap" id="f1-j"></div><div class="t" id="f1-t"></div><div class="s" id="f1-s"></div></div>
  </div>
  <button class="btn-wide btn-light draw-btn" onclick="selectWinner(2)">どっちも同じくらい好き（引き分け）</button>
  <button id="undo-btn" class="btn-secondary btn-small" onclick="undo()" disabled>ひとつ戻る</button>
</div>

<!-- 結果 -->
<div id="phase3" class="step-container hidden">
  <h2 id="result-title">あんたの好きな曲TOP10、できたで！</h2>
  <p class="desc">この画像をそのままXに投稿できるで</p>
  <div class="result-img-wrap">
    <img id="result-img" alt="あなたのNMB48好きな曲ランキング">
    <div id="result-loading" class="result-loading">画像つくってるで…</div>
  </div>
  <p class="help">画像を長押ししても保存できるで</p>
  <button class="btn-wide btn-twitter" onclick="shareToX()">𝕏 に画像つきで投稿する</button>
  <button class="btn-wide" onclick="saveImage()">画像を保存する</button>
  <button class="btn-wide btn-light" onclick="restart()">もっかい最初からやる</button>
</div>

<div class="sticky-bar" id="sticky-bar">
  <div class="sticky-inner">
    <div class="sel-info">選択中 <b id="sel-count">0</b>曲<small id="sel-hint"></small></div>
    <button class="btn-secondary" id="clear-btn" onclick="clearAll()">リセット</button>
    <button id="start-btn" onclick="startSort()">ソート開始</button>
  </div>
</div>

<div id="toast"></div>

"s30": "https://48pedia.org/images/5/5a/%E3%81%8C%E3%82%93%E3%81%B0%E3%82%89%E3%81%AC%E3%82%8F%E3%81%84_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-A.jpg",
"s31": "https://48pedia.org/images/b/b1/%E3%83%81%E3%83%A5%E3%83%BC%E3%82%B9%E3%83%88%E3%83%A9%E3%82%A4%E3%82%AF_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-A.jpg",
"s32": "https://48pedia.org/images/8/82/%E9%9D%92%E6%98%A5%E3%81%AE%E3%83%87%E3%83%83%E3%83%89%E3%83%A9%E3%82%A4%E3%83%B3_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-A.jpg",
"s33": "https://48pedia.org/images/f/fb/%E5%88%9D%E3%82%81%E3%81%A6%E3%81%AE%E3%82%AA%E3%83%BC%E3%83%AB_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-A.jpg",
"a1": "https://48pedia.org/images/5/5d/%E3%81%A6%E3%81%A3%E3%81%BA%E3%82%93%E3%81%A8%E3%81%A3%E3%81%9F%E3%82%93%E3%81%A7%21_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-N.jpg",
"a2": "https://48pedia.org/images/e/e6/%E4%B8%96%E7%95%8C%E3%81%AE%E4%B8%AD%E5%BF%83%E3%81%AF%E5%A4%A7%E9%98%AA%E3%82%84_%EF%BD%9E%E3%81%AA%E3%82%93%E3%81%B0%E8%87%AA%E6%B2%BB%E5%8C%BA%EF%BD%9E_%E9%80%9A%E5%B8%B8%E7%9B%A4_Type-N.jpg",
"a3": "https://48pedia.org/images/7/75/%E9%9B%A3%E6%B3%A2%E6%84%9B%EF%BD%9E%E4%BB%8A%E3%80%81%E6%80%9D%E3%81%86%E3%81%93%E3%81%A8%EF%BD%9E_%E5%88%9D%E5%9B%9E%E9%99%90%E5%AE%9A%E7%9B%A4_Type-N.jpg",
"a4": "https://48pedia.org/images/a/a4/NMB13_%E5%88%9D%E5%9B%9E%E9%99%90%E5%AE%9A%E7%9B%A4_Type-N.jpg",
"k1": "https://48pedia.org/images/a/a8/%E9%88%B4%E6%87%B8%E3%81%AA%E3%82%93%E3%81%A1%E3%82%83%E3%82%89_Type_A.jpg",
"k2": "https://48pedia.org/images/a/ad/Green_Flash_Type_A_%E9%80%9A%E5%B8%B8%E7%9B%A4.jpg",
"k3": "https://48pedia.org/images/4/45/%E5%90%9B%E3%81%AF%E3%83%A1%E3%83%AD%E3%83%87%E3%82%A3%E3%83%BC_Type_A_%E9%80%9A%E5%B8%B8%E7%9B%A4.jpg",
"k4": "https://48pedia.org/images/5/5c/%E3%82%B7%E3%83%A5%E3%83%BC%E3%83%88%E3%82%B5%E3%82%A4%E3%83%B3_Type_A_%E9%80%9A%E5%B8%B8%E7%9B%A4.jpg",
"k5": "https://48pedia.org/images/a/a3/%E3%82%B8%E3%83%A3%E3%83%BC%E3%83%90%E3%83%BC%E3%82%B8%E3%83%A3_Type_A_%E9%80%9A%E5%B8%B8%E7%9B%A4.jpg"
};
const JACKET_DIR = 'jacket/';
SONGS.forEach((s, i) => s.id = i);

const CATS = ['表題曲', 'カップリング', 'アルバム・その他', '公演曲'];
let TOP_N = 10;
let catOn = new Set(CATS);
let selected = new Set();
let sortQueues = [], parentQueue = [], undoStack = [], battleCount = 0, ties = [];
let finalList = [], finalRanks = [], resultBlob = null;

/* ---------- ジャケ写 ---------- */
function jacketCands(key) {
  const u = JACKETS[key];
  if (!u) return [];
  const local = JACKET_DIR + key + '.jpg';
  return location.protocol.startsWith('http') ? [local, u] : [u];
}
function placeholder() {
  const d = document.createElement('div');
  d.className = 'jk-ph';
  d.textContent = '公演';
  return d;
}
function jacketEl(key) {
  const c = jacketCands(key);
  if (!c.length) return placeholder();
  const im = document.createElement('img');
  im.className = 'jk';
  im.alt = '';
  im.loading = 'lazy';
  let i = 0;
  im.onerror = () => { i++; if (i < c.length) im.src = c[i]; else im.replaceWith(placeholder()); };
  im.src = c[0];
  return im;
}
// 結果画像用（キャンバスに描けるよう、自分のサイトの画像 → 画像プロキシの順）
function loadJacket(key) {
  const u = JACKETS[key];
  if (!u) return Promise.resolve(null);
  const list = [];
  if (location.protocol.startsWith('http')) list.push(JACKET_DIR + key + '.jpg');
  list.push(`https://wsrv.nl/?url=${encodeURIComponent(u)}&w=300&output=jpg`);
  list.push(`https://images.weserv.nl/?url=${encodeURIComponent(u)}&w=300&output=jpg`);
  return new Promise(resolve => {
    let i = 0;
    const next = () => {
      if (i >= list.length) { resolve(null); return; }
      const im = new Image();
      im.crossOrigin = 'anonymous';
      const timer = setTimeout(() => { im.onload = im.onerror = null; i++; next(); }, 8000);
      im.onload = () => { clearTimeout(timer); resolve(im); };
      im.onerror = () => { clearTimeout(timer); i++; next(); };
      im.src = list[i];
    };
    next();
  });
}

/* ---------- 予選 ---------- */
function setTop(n) {
  TOP_N = n;
  document.querySelectorAll('[data-top]').forEach(b => b.classList.toggle('active', Number(b.dataset.top) === n));
  updateBar();
}

function buildChips() {
  const box = document.getElementById('cat-chips');
  box.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (catOn.has(c) ? ' on' : '');
    b.textContent = c;
    b.onclick = () => { catOn.has(c) ? catOn.delete(c) : catOn.add(c); buildChips(); renderList(); };
    box.appendChild(b);
  });
}

function visibleSongs() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return SONGS.filter(s => catOn.has(s.c) &&
    (!q || s.t.toLowerCase().includes(q) || s.s.toLowerCase().includes(q) || s.h.toLowerCase().includes(q)));
}

function renderList() {
  const box = document.getElementById('song-list');
  box.innerHTML = '';
  const list = visibleSongs();
  if (!list.length) {
    box.innerHTML = `<div class="empty-msg">${catOn.size ? '見つからへんかったわ…' : '種類を1つ以上選んでな'}</div>`;
    return;
  }
  let g = null, wrap = null;
  list.forEach(s => {
    if (s.g !== g) {
      g = s.g;
      const head = document.createElement('div');
      head.className = 'group-head';
      const kind = s.g.startsWith('s') ? 'シングル' : s.g.startsWith('p') ? '公演' : 'アルバム';
      head.appendChild(jacketEl(s.j));
      const hl = document.createElement('span');
      hl.className = 'hl';
      hl.innerHTML = `<span class="cat">${kind}</span> `;
      hl.appendChild(document.createTextNode(s.h));
      head.appendChild(hl);
      const all = document.createElement('button');
      all.className = 'all';
      all.textContent = 'まとめて';
      const members = list.filter(x => x.g === g);
      all.onclick = () => {
        const on = !members.every(x => selected.has(x.id));
        members.forEach(x => on ? selected.add(x.id) : selected.delete(x.id));
        refreshMarks();
      };
      if (members.length > 1) head.appendChild(all);   // 1曲だけなら「まとめて」は出さない
      box.appendChild(head);
      wrap = document.createElement('div');
      wrap.className = 'songs';
      box.appendChild(wrap);
    }
    const b = document.createElement('button');
    b.className = 'song' + (s.c === '表題曲' ? ' title' : '') + (selected.has(s.id) ? ' on' : '');
    b.dataset.id = s.id;
    b.textContent = s.t;
    b.onclick = () => { selected.has(s.id) ? selected.delete(s.id) : selected.add(s.id); b.classList.toggle('on'); updateBar(); };
    wrap.appendChild(b);
  });
  updateBar();
}

function refreshMarks() {
  document.querySelectorAll('.song[data-id]').forEach(b => b.classList.toggle('on', selected.has(Number(b.dataset.id))));
  updateBar();
}

function bulk(on) {
  visibleSongs().forEach(s => on ? selected.add(s.id) : selected.delete(s.id));
  refreshMarks();
}
function clearAll() { selected.clear(); refreshMarks(); }

function updateBar() {
  const n = selected.size;
  document.getElementById('sel-count').textContent = n;
  document.getElementById('clear-btn').disabled = n === 0;
  document.getElementById('start-btn').disabled = n < TOP_N;
  document.getElementById('sel-hint').textContent =
    n < TOP_N ? `TOP${TOP_N}やから、あと${TOP_N - n}曲選んでな` : `だいたい${estimate(n)}回くらいのバトルになるで`;
}
// 上位TOP_Nだけ決めるマージソートのおおよその対戦回数
function estimate(n) {
  let total = 0, size = 1;
  while (size < n) {
    const pairs = Math.floor(n / (size * 2));
    total += pairs * Math.min(size * 2 - 1, TOP_N);
    size *= 2;
  }
  return Math.max(1, Math.round(total * 0.85));
}

/* ---------- ソート（上位TOP_Nだけ決めるマージソート・引き分けあり） ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function showPhase(n) {
  [1, 2, 3].forEach(i => document.getElementById('phase' + i).classList.toggle('hidden', i !== n));
  document.getElementById('sticky-bar').classList.toggle('hidden', n !== 1);
  document.querySelector('a.back').classList.toggle('hidden', n === 2);
}

function startSort() {
  if (selected.size < TOP_N) return;
  const list = shuffle(SONGS.filter(s => selected.has(s.id)));
  sortQueues = list.map(s => [s]);
  parentQueue = []; undoStack = []; battleCount = 0; ties = [];
  showPhase(2);
  window.scrollTo(0, 0);
  nextMergeStep();
}

function nextMergeStep() {
  if (sortQueues.length <= 1) { showRanking(); return; }
  parentQueue = [];
  for (let i = 0; i < sortQueues.length; i += 2) {
    parentQueue.push({ left: sortQueues[i], right: sortQueues[i + 1] || [], merged: [] });
  }
  sortQueues = [];
  processNextPair();
}

function processNextPair() {
  while (parentQueue.length > 0) {
    const p = parentQueue[0];
    if (p.left.length === 0 || p.right.length === 0 || p.merged.length >= TOP_N) {
      p.merged.push(...p.left, ...p.right);
      sortQueues.push(p.merged.slice(0, TOP_N));
      parentQueue.shift();
      continue;
    }
    renderBattle(p.left[0], p.right[0]);
    return;
  }
  nextMergeStep();
}

function renderBattle(a, b) {
  [[a, 'f0-j'], [b, 'f1-j']].forEach(([s, id]) => {
    const box = document.getElementById(id);
    box.innerHTML = '';
    box.appendChild(jacketEl(s.j));
  });
  document.getElementById('f0-t').textContent = a.t;
  document.getElementById('f0-s').textContent = a.s;
  document.getElementById('f1-t').textContent = b.t;
  document.getElementById('f1-s').textContent = b.s;
  document.getElementById('progress-desc').textContent = `第${battleCount + 1}戦`;
  document.getElementById('undo-btn').disabled = undoStack.length === 0;
}

function selectWinner(choice) {
  undoStack.push(JSON.stringify({ sortQueues, parentQueue, battleCount, ties }));
  const p = parentQueue[0];
  if (choice === 2) {
    const a = p.left.shift(), b = p.right.shift();
    ties.push(a.id + '|' + b.id);
    p.merged.push(a, b);
  } else {
    p.merged.push(choice === 0 ? p.left.shift() : p.right.shift());
  }
  battleCount++;
  processNextPair();
}

function undo() {
  if (!undoStack.length) return;
  const s = JSON.parse(undoStack.pop());
  sortQueues = s.sortQueues; parentQueue = s.parentQueue; battleCount = s.battleCount; ties = s.ties || [];
  showPhase(2);
  processNextPair();
}

/* ---------- 結果 ---------- */
function showRanking() {
  finalList = (sortQueues[0] || []).slice(0, TOP_N);
  const tied = (x, y) => ties.includes(x.id + '|' + y.id) || ties.includes(y.id + '|' + x.id);
  finalRanks = finalList.map((s, i) => i + 1);
  for (let i = 1; i < finalList.length; i++) if (tied(finalList[i - 1], finalList[i])) finalRanks[i] = finalRanks[i - 1];

  showPhase(3);
  window.scrollTo(0, 0);
  document.getElementById('result-title').textContent = `あんたの好きな曲TOP${finalList.length}、できたで！`;
  resultBlob = null;
  const img = document.getElementById('result-img');
  img.removeAttribute('src');
  const loading = document.getElementById('result-loading');
  loading.textContent = '画像つくってるで…';
  loading.classList.remove('hidden');
  drawResultImage(finalList).then(c => {
    img.src = c.toDataURL('image/png');
    c.toBlob(b => { resultBlob = b; }, 'image/png');
    loading.classList.add('hidden');
  }).catch(() => {
    loading.textContent = '画像作られへんかったわ…スクショで保存してな';
  });
}

const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, text, maxW, size, weight) {
  let s = size;
  do { ctx.font = `${weight} ${s}px ${FONT}`; s -= 1; } while (ctx.measureText(text).width > maxW && s > 12);
}

async function drawResultImage(list) {
  const jackets = await Promise.all(list.map(s => loadJacket(s.j)));
  const W = 1080, topH = 190, rowH = list.length > 10 ? 86 : 100, headH = 270;
  const H = headH + topH + 16 + (list.length - 1) * (rowH + 12) + 110;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff1e0'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; roundRect(ctx, 30, 30, W - 60, H - 60, 36); ctx.fill();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#333'; ctx.font = `bold 48px ${FONT}`;
  ctx.fillText('あなたの', W / 2, 116);
  ctx.fillStyle = '#f07800'; ctx.font = `bold 64px ${FONT}`;
  ctx.fillText(`NMB48 好きな曲 TOP${list.length}`, W / 2, 194);
  ctx.fillStyle = '#999'; ctx.font = `28px ${FONT}`;
  ctx.fillText('楽曲ソートの結果', W / 2, 240);

  const x = 70, w = W - 140;
  let y = headH;
  list.forEach((s, i) => {
    const rank = finalRanks[i] || i + 1;
    const top = i === 0;
    const h = top ? topH : rowH;
    // 枠
    ctx.save();
    ctx.shadowColor = 'rgba(240,120,0,.15)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
    ctx.fillStyle = top ? '#fffaf2' : (rank <= 3 ? '#fffdf9' : '#fff');
    roundRect(ctx, x, y, w, h, 22); ctx.fill();
    ctx.restore();
    ctx.lineWidth = top ? 6 : 3;
    ctx.strokeStyle = rank === 1 ? '#e6b422' : rank <= 3 ? '#ffc58a' : '#f3e2cf';
    roundRect(ctx, x, y, w, h, 22); ctx.stroke();
    // 順位
    const bs = top ? 110 : rowH - 30;
    ctx.fillStyle = rank === 1 ? '#e6b422' : rank === 2 ? '#b5b5b5' : rank === 3 ? '#cd7f32' : '#f07800';
    roundRect(ctx, x + 22, y + (h - bs) / 2, bs, bs, bs / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(bs * (rank >= 10 ? 0.4 : 0.48))}px ${FONT}`;
    ctx.fillText(rank + (top ? '位' : ''), x + 22 + bs / 2, y + h / 2 + 2);
    // ジャケ写
    const js = h - (top ? 36 : 22), jx = x + 22 + bs + 20, jy = y + (h - js) / 2;
    ctx.save();
    roundRect(ctx, jx, jy, js, js, 10); ctx.clip();
    if (jackets[i]) {
      const im = jackets[i], sz = Math.min(im.naturalWidth, im.naturalHeight);
      ctx.drawImage(im, (im.naturalWidth - sz) / 2, (im.naturalHeight - sz) / 2, sz, sz, jx, jy, js, js);
    } else {
      const g = ctx.createLinearGradient(jx, jy, jx + js, jy + js);
      g.addColorStop(0, '#ffb35c'); g.addColorStop(1, '#f07800');
      ctx.fillStyle = g; ctx.fillRect(jx, jy, js, js);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.round(js * 0.26)}px ${FONT}`;
      ctx.fillText(s.c === '公演曲' ? '公演' : '♪', jx + js / 2, jy + js / 2);
    }
    ctx.restore();
    // 曲名・収録
    const tx = jx + js + 24, tw = w - (tx - x) - 26;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#333';
    fitText(ctx, s.t, tw, top ? 54 : (rowH > 90 ? 38 : 34), 'bold');
    ctx.fillText(s.t, tx, y + h / 2 + (top ? 6 : 2));
    ctx.fillStyle = '#aaa';
    fitText(ctx, s.s, tw, top ? 26 : 21, 'normal');
    ctx.fillText(s.s, tx, y + h / 2 + (top ? 50 : 32));
    y += h + (top ? 16 : 12);
  });

  ctx.textAlign = 'center'; ctx.fillStyle = '#bbb'; ctx.font = `26px ${FONT}`;
  const u = pageUrl();
  ctx.fillText(u ? u.replace(/^https?:\/\//, '') : '#NMB48楽曲ソート', W / 2, H - 70);
  return c;
}

/* ---------- 保存・投稿 ---------- */
function pageUrl() {
  try { const u = new URL(location.href); if (!/^https?:$/.test(u.protocol)) return ''; u.search = ''; u.hash = ''; return u.toString(); }
  catch (e) { return ''; }
}
function shareText() {
  const cut = t => t.length > 18 ? t.slice(0, 17) + '…' : t;
  const lines = finalList.slice(0, 7).map((s, i) => `${finalRanks[i] || i + 1}位 ${cut(s.t)}`);
  const u = pageUrl();
  return `うちのNMB48 好きな曲TOP${finalList.length}\n\n${lines.join('\n')}\n\n#NMB48楽曲ソート` + (u ? `\n${u}` : '');
}
function resultFile() {
  if (!resultBlob) return null;
  try { return new File([resultBlob], 'nmb48_songs.png', { type: 'image/png' }); } catch (e) { return null; }
}
async function shareWithSheet(withText) {
  const f = resultFile();
  if (!f || !navigator.canShare || !navigator.canShare({ files: [f] })) return false;
  try { await navigator.share(withText ? { files: [f], text: shareText() } : { files: [f] }); return true; }
  catch (e) { return e && e.name === 'AbortError'; }
}
async function saveImage() {
  if (!resultBlob) { showToast('画像つくってる途中や、ちょっと待ってな'); return; }
  if (await shareWithSheet(false)) return;
  try {
    const a = document.createElement('a');
    a.href = document.getElementById('result-img').src; a.download = 'nmb48_songs.png';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  showToast('保存できへん時は、画像を長押しして保存してな');
}
async function shareToX() {
  if (!resultBlob) { showToast('画像つくってる途中や、ちょっと待ってな'); return; }
  if (await shareWithSheet(true)) return;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}`;
  showToast('先に画像を保存して、Xの投稿画面で添付してな');
  setTimeout(() => { const w = window.open(url, '_blank'); if (!w) location.href = url; }, 900);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function restart() {
  showPhase(1);
  window.scrollTo(0, 0);
  refreshMarks();
}

buildChips();
renderList();
</script>
